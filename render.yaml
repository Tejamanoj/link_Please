services:
  - type: web
    name: linkplease-backend
    plan: free
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PSEUDOGRAM_API_KEY
        sync: false
      - key: PSEUDOGRAM_BASE_URL
        value: https://pseudogram-api.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: MAX_DM_RETRIES
        value: "3"
      - key: VERIFY_WEBHOOK_SIGNATURE
        value: "true"
